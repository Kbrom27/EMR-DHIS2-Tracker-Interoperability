name: Build Linux App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tkinter and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Build App
        run: |
          pyinstaller --clean --noconfirm EMR_DHIS2_Tracker_Interoperability_App_V102.spec

      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMR-DHIS2-Tracker-interoperability-App-V102-Linux
          path: dist/EMR-DHIS2 Tracker interoperability App V102