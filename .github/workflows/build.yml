name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name EMR_DHIS2_Interoperability_App emr_dhis2_tracker_sync.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMR_DHIS2_Interoperability_App
          path: dist/EMR_DHIS2_Interoperability_App.exe
