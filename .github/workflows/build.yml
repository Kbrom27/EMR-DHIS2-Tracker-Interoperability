name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Build EXE
        run: |
          pyinstaller --clean --noconfirm EMR_DHIS2_Tracker_Interoperability_App_V102.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMR-DHIS2-Tracker-interoperability-App-V102
          path: dist/EMR-DHIS2 Tracker interoperability App V102.exe